name: hforge

services:
  api:
    image: ghcr.io/h5uarez/hforge-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data

  web:
    image: ghcr.io/h5uarez/hforge-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
