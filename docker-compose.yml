name: hforge

services:
  # One-time: copy exercise images + GIFs from the operator-supplied local source into ./media
  # (skipped if already there). Set EXERCISE_MEDIA_SOURCE to that source directory.
  media:
    image: alpine:3.20
    volumes:
      - ${EXERCISE_MEDIA_SOURCE:?Set EXERCISE_MEDIA_SOURCE to the local exercise source directory}:/source:ro
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          if [ ! -d /source/images ] || [ ! -d /source/videos ]; then
            echo "EXERCISE_MEDIA_SOURCE must contain images/ and videos/" >&2
            exit 1
          fi
          echo "↓ Copying exercise media from the supplied local source…"
          cp /source/images/*.jpg /out/img/ && cp /source/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # Local development intentionally builds from source. Production uses docker-compose.prod.yml.
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      # Docker Desktop on Windows can accept IPv6 localhost connections without
      # forwarding the HTTP request. Bind the local development port explicitly
      # to IPv4; Azure will expose it through the HTTPS reverse proxy instead.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
