name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  API_IMAGE: ghcr.io/h5uarez/hforge-api
  WEB_IMAGE: ghcr.io/h5uarez/hforge-web
  HEALTH_URL: https://hforge.westeurope.cloudapp.azure.com/api/health

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_VM_HOST \
            AZURE_VM_USER \
            AZURE_SSH_PRIVATE_KEY \
            AZURE_VM_KNOWN_HOSTS \
            GHCR_USERNAME \
            GHCR_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required deployment secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Configure strict SSH host verification
        shell: bash
        env:
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

      - name: Upload production Compose file
        shell: bash
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o PreferredAuthentications=publickey
          )
          scp "${SSH_OPTIONS[@]}" \
            docker-compose.prod.yml \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:/opt/hforge/docker-compose.prod.yml"

      - name: Pull immutable images and restart the VM
        shell: bash
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o PreferredAuthentications=publickey
          )
          {
            printf '%s\n' "$GHCR_USERNAME"
            printf '%s\n' "$GHCR_READ_TOKEN"
            printf '%s\n' "$IMAGE_TAG"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          IFS= read -r GHCR_USERNAME
          IFS= read -r GHCR_READ_TOKEN
          IFS= read -r IMAGE_TAG
          export IMAGE_TAG

          cd /opt/hforge
          test -f .env || { echo 'ERROR: /opt/hforge/.env is missing; refusing deployment.' >&2; exit 1; }
          for path in data media media/img media/gif; do
            test -d "$path" || {
              echo "ERROR: /opt/hforge/$path is missing; refusing deployment." >&2
              exit 1
            }
          done
          test -f docker-compose.prod.yml || {
            echo 'ERROR: docker-compose.prod.yml was not uploaded.' >&2
            exit 1
          }

          docker compose --env-file .env -f docker-compose.prod.yml config --quiet
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin >/dev/null
          docker compose --env-file .env -f docker-compose.prod.yml pull api web
          docker compose --env-file .env -f docker-compose.prod.yml up -d --no-build api web

          web_port="$(docker compose --env-file .env -f docker-compose.prod.yml port web 80 \
            | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$web_port" || {
            echo 'ERROR: Could not determine the published web port.' >&2
            exit 1
          }
          health_url="http://127.0.0.1:${web_port}/api/health"
          health_ok=false
          for attempt in $(seq 1 24); do
            if response="$(curl --fail --silent --show-error --max-time 10 "$health_url")" \
              && printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo 'Local health check passed.'
              health_ok=true
              break
            fi
            sleep 5
          done
          if [[ "$health_ok" != true ]]; then
            echo "ERROR: Local health check failed: $health_url" >&2
            exit 1
          fi
          REMOTE_SCRIPT
          } | ssh "${SSH_OPTIONS[@]}" \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}" 'bash -s'

      - name: Verify public HTTPS health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-connrefused --max-time 30 "$HEALTH_URL")"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          echo "External health check passed: $HEALTH_URL"
