name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  API_IMAGE: ghcr.io/h5uarez/hforge-api
  WEB_IMAGE: ghcr.io/h5uarez/hforge-web
  HEALTH_URL: https://hforge.westeurope.cloudapp.azure.com/api/health

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            GHCR_USERNAME \
            GHCR_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required deployment secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Require deployment from main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo '::error::The Azure federated credential is restricted to refs/heads/main.'
          exit 1

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy through Azure VM Run Command
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          script_file="$(mktemp)"
          trap 'rm -f "$script_file"' EXIT
          cat > "$script_file" <<'VM_SCRIPT'
          # Azure RunShellScript invokes Linux scripts with /bin/sh, not Bash.
          # Keep this payload POSIX-compatible so failures cannot be swallowed by
          # the VM agent's generic provisioning status.
          set -eu

          if [ "$#" -ne 4 ]; then
            echo 'ERROR: Expected GHCR username, GHCR token, image SHA, and Compose payload.' >&2
            exit 1
          fi

          GHCR_USERNAME="$1"
          GHCR_READ_TOKEN="$2"
          IMAGE_TAG="$3"
          COMPOSE_B64="$4"
          export IMAGE_TAG

          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo 'ERROR: The image tag must be a full commit SHA.' >&2
            exit 1
          fi
          case "$IMAGE_TAG" in
            *[!0-9a-fA-F]*)
              echo 'ERROR: The image tag must be a full hexadecimal commit SHA.' >&2
              exit 1
              ;;
          esac

          cd /opt/hforge
          test -f .env || { echo 'ERROR: /opt/hforge/.env is missing; refusing deployment.' >&2; exit 1; }
          for path in data media media/img media/gif; do
            test -d "$path" || {
              echo "ERROR: /opt/hforge/$path is missing; refusing deployment." >&2
              exit 1
            }
          done

          # Azure CLI parses parameters as [name=]value. The Compose payload is
          # sent without base64 padding so its trailing '=' cannot be mistaken
          # for the parameter separator.
          case $((${#COMPOSE_B64} % 4)) in
            0) ;;
            2) COMPOSE_B64="${COMPOSE_B64}==" ;;
            3) COMPOSE_B64="${COMPOSE_B64}=" ;;
            *)
              echo 'ERROR: Invalid unpadded Compose base64 length.' >&2
              exit 1
              ;;
          esac
          printf '%s' "$COMPOSE_B64" | base64 --decode > docker-compose.prod.yml
          unset COMPOSE_B64

          docker compose --env-file .env -f docker-compose.prod.yml config --quiet
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin >/dev/null
          unset GHCR_READ_TOKEN GHCR_USERNAME
          docker compose --env-file .env -f docker-compose.prod.yml pull api web

          # The VM may still have the pre-OIDC OpenGym Compose project running on
          # the published web port. Stop that project without removing volumes so
          # the Hforge project can take ownership of the port.
          if [ -f docker-compose.yml ]; then
            docker compose --env-file .env -f docker-compose.yml down --remove-orphans
          fi
          docker compose --env-file .env -f docker-compose.prod.yml up -d --no-build api web

          web_port="$(docker compose --env-file .env -f docker-compose.prod.yml port web 80 \
            | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$web_port" || {
            echo 'ERROR: Could not determine the published web port.' >&2
            exit 1
          }
          health_url="http://127.0.0.1:${web_port}/api/health"
          health_ok=false
          for attempt in $(seq 1 24); do
            if response="$(curl --fail --silent --show-error --max-time 10 "$health_url")" \
              && printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo 'Local health check passed.'
              health_ok=true
              break
            fi
            sleep 5
          done
          if [ "$health_ok" != true ]; then
            echo "ERROR: Local health check failed: $health_url" >&2
            exit 1
          fi
          VM_SCRIPT

          compose_b64="$(base64 < docker-compose.prod.yml | tr -d '\n=')"
          run_output="$(az vm run-command invoke \
            --resource-group hforge-rg \
            --name hforge-vm \
            --command-id RunShellScript \
            --scripts "@{${script_file}}" \
            --parameters "ghcr_username=$GHCR_USERNAME" "ghcr_token=$GHCR_READ_TOKEN" "image_tag=$IMAGE_TAG" "compose_b64=$compose_b64" \
            --output json)"
          if ! printf '%s' "$run_output" | grep -q 'Local health check passed.'; then
            printf '%s\n' "$run_output"
            echo '::error::Azure VM Run Command did not report a successful local health check.'
            exit 1
          fi

      - name: Verify public HTTPS health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-connrefused --max-time 30 "$HEALTH_URL")"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          echo "External health check passed: $HEALTH_URL"
