name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check API syntax
        working-directory: api
        run: node --check server.js

  compose:
    name: Validate Compose and build local images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose and build local services
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          RP_ID=localhost
          ORIGIN=http://localhost:8080
          RP_NAME=hforge-ci
          SESSION_SECRET=ci-only-session-secret
          VAPID_SUBJECT=mailto:ci@example.invalid
          WEB_PORT=18080
          EXERCISE_MEDIA_SOURCE=/tmp/exercise-media
          EOF
          docker compose config --quiet
          docker compose build api web
