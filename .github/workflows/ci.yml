name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Version metadata and release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test version release gate
        run: node --test scripts/check-version.test.mjs

      - name: Validate version metadata and release bump
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_ref=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "${BEFORE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            base_ref="$BEFORE_SHA"
          fi

          if [[ -n "$base_ref" ]]; then
            echo "Comparing release metadata with Git base $base_ref."
            node scripts/check-version.mjs --base-ref "$base_ref"
          else
            echo "No usable previous commit was supplied; running consistency validation only."
            node scripts/check-version.mjs
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Enforce frontend coverage ratchet
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser functional and visual regression
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Install application dependencies
        shell: pwsh
        run: |
          # PowerShell does not reliably stop after a native npm command fails.
          $ErrorActionPreference = 'Stop'
          # Browser checks do not use capacitor-assets; skip its flaky sharp/libvips install hook.
          npm ci --prefix frontend --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Playwright browsers
        working-directory: frontend
        run: .\node_modules\.bin\playwright.cmd install chromium firefox webkit

      - name: Verify real media server and Vite proxy
        working-directory: frontend
        run: npm run test:browser:media

      - name: Run browser compatibility matrix
        working-directory: frontend
        run: npm run test:browser:functional

      - name: Compare Windows Chromium visual baselines
        working-directory: frontend
        run: npm run test:browser:visual

      - name: Verify Chromium virtual-authenticator passkeys
        working-directory: frontend
        run: npm run test:browser:webauthn

      - name: Upload Playwright report and image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Check API syntax
        working-directory: api
        run: node --check server.js

  compose:
    name: Validate Compose and build local images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test environment contract
        run: node --test scripts/check-env-contract.test.mjs

      - name: Validate Compose and build local services
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          RP_ID=localhost
          ORIGIN=http://localhost:8080
          RP_NAME=hforge-ci
          SESSION_SECRET=ci-only-session-secret
          VAPID_SUBJECT=mailto:ci@example.invalid
          WEB_PORT=18080
          EXERCISE_MEDIA_SOURCE=./.ci/exercise-media
          EOF
          mkdir -p .ci/exercise-media/images .ci/exercise-media/videos
          docker compose config --quiet
          docker compose build api web
